[mcp_servers.claude-subagents]
command = "claude-subagents-mcp"
tool_timeout_sec = 65
env_vars = ["ANTHROPIC_API_KEY"]

[mcp_servers.claude-subagents.env]
ANTHROPIC_BASE_URL = "https://api.anthropic.com"
CLAUDE_DEFAULT_MODEL = "claude-fable-5-1"
CLAUDE_DEFAULT_REASONING_EFFORT = "medium"

# ANTHROPIC_API_KEY is forwarded from your shell environment via env_vars.
# Do not place secrets in this file or commit them to version control.
# Set it in your shell before launching Codex:
#
#   export ANTHROPIC_API_KEY="your-api-key"
